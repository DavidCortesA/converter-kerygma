# Genera los instaladores de Mac y Windows.
# - Al publicar un tag (git tag v0.2.0 && git push origin v0.2.0) crea una Release
#   con cada instalador como descarga independiente.
# - También se puede lanzar a mano desde la pestaña Actions; ahí cada versión
#   queda como un artifact separado.
name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            target: --win
          - os: macos-latest
            arch: arm64
            target: --mac
            label: Apple-Silicon
          - os: macos-latest
            arch: x64
            target: --mac
            label: Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm_config_arch hace que ffmpeg-static descargue el binario de la arquitectura destino.
      - run: npm ci
        env:
          npm_config_arch: ${{ matrix.arch }}

      - name: Empaquetar Windows
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # El .dmg lleva el nombre del tipo de Mac (Apple-Silicon / Intel) en lugar de arm64 / x64.
      - name: Empaquetar Mac
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never "-c.dmg.artifactName=Kerygma-Converter-\${version}-Mac-${{ matrix.label }}.\${ext}"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Subir instalador de Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Kerygma Converter - Windows Instalador
          path: dist/Kerygma-Converter-*-Windows-Instalador.exe
          if-no-files-found: error

      - name: Subir versión portable de Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Kerygma Converter - Windows Portable
          path: dist/Kerygma-Converter-*-Windows-Portable.exe
          if-no-files-found: error

      - name: Subir instalador de Mac
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Kerygma Converter - Mac ${{ matrix.label }}
          path: dist/Kerygma-Converter-*-Mac-${{ matrix.label }}.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Kerygma Converter ${{ github.ref_name }}
          generate_release_notes: true
          files: instaladores/*
